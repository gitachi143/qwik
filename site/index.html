<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Qwik — a small beginning for something great.">
    <title>Qwik</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='13' y='46' font-family='Arial' font-size='42' font-weight='bold' fill='white'%3Eq%3C/text%3E%3C/svg%3E">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: #f6f8fc; color: #142038; font: 1rem/1.6 system-ui, sans-serif; }
      header, footer { padding: 1.5rem clamp(1.5rem, 6vw, 6rem); }
      header { font-size: 1.5rem; font-weight: 800; letter-spacing: -.06em; }
      main { flex: 1; display: grid; align-content: center; padding: 4rem clamp(1.5rem, 10vw, 10rem); }
      .eyebrow { color: #2454b8; font-size: .875rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 12ch; margin: 1rem 0 1.5rem; font-size: clamp(3.5rem, 9vw, 7.5rem); line-height: 1.05; letter-spacing: -.065em; }
      p { max-width: 34rem; margin: 0 0 2rem; font-size: 1.125rem; color: #526079; }
      a { width: fit-content; padding: .875rem 1.25rem; border-radius: .6rem; background: #2454b8; color: white; text-decoration: none; font-weight: 600; }
      a:hover { background: #173d8e; }
      a:focus-visible { outline: 3px solid #142038; outline-offset: 4px; }
      footer { color: #526079; font-size: .875rem; }
    </style>
  </head>
  <body>
    <header>qwik.</header>
    <main>
      <span class="eyebrow">Hello, world</span>
      <h1>It starts here.</h1>
      <p>Welcome to Qwik. A small beginning, with room to grow.</p>
      <a href="https://github.com/gitachi143/qwik">View on GitHub</a>
    </main>
    <footer>Qwik · Built for what comes next.</footer>
  </body>
</html>
